<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="weather-default">

    <main class="weather-app">

        <h1>Weather App</h1>

        <form class="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
                autocomplete="off"
            >

            <button type="submit">
                Search
            </button>
        </form>
        <button type="button" id="location-button">
            <span>📍</span>
            Use my location
        </button>

        <section class="search-history hidden">
            <div class="history-header">
                <h3>Recent searches</h3>
                <button type="button" id="clear-history">
                    Clear
                </button>
            </div>

            <div id="history-list"></div>
        </section>

        <section class="weather-card">
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading weather...</p>
            </div>
        
            <div class="weather-header">
            
                <h2 id="city-name">City Name</h2>
            
                <img 
                    id="weather-icon" 
                    class="hidden" 
                    src="" 
                    alt="Weather Icon"
                >
            
                <p id="weather-description">
                    Weather description
                </p>
            
            </div>
        
        
            <div class="temperature">
                <span id="temperature">--</span>
                <span>°C</span>
            </div>
        
        
            <div class="weather-details">

                <div class="detail">
                    <span>💧 Humidity</span>
                <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨 Wind</span>
                    <strong id="wind-speed">-- m/s</strong>
                </div>

                <div class="detail">
                    <span>🌡 Feels like</span>
                    <strong id="feels-like">--°C</strong>
                </div>
                <div class="detail">
                    <span>🌅 Sunrise</span>
                    <strong id="sunrise">--:--</strong>
                </div>
                
                <div class="detail">
                    <span>🌇 Sunset</span>
                    <strong id="sunset">--:--</strong>
                </div>

                <div class="detail">
                    <span>🔽 Min</span>
                    <strong id="temp-min">--°C</strong>
                </div>

                <div class="detail">
                    <span>🔼 Max</span>
                    <strong id="temp-max">--°C</strong>
                </div>

                <div class="detail">
                    <span>📍 Country</span>
                    <strong id="country">--</strong>
                </div>

            </div>
            
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
